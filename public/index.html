<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>РИБА 🐟</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, Arial;
  background: #f7f8fc;
  color: #222;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 12px;
}

h1 {
  text-align: center;
  font-size: 28px;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 20px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}

textarea {
  width: 100%;
  min-height: 120px;
  border-radius: 10px;
  border: 1px solid #ddd;
  padding: 12px;
  resize: none;
}

#input {
  height: 140px;
  max-height: 140px;
  overflow-y: auto;
}

#output {
  overflow: hidden;
}

.counter {
  font-size: 12px;
  text-align: right;
  margin-bottom: 6px;
  color: #888;
}

.row {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

button {
  border-radius: 10px;
  border: 1px solid #ddd;
  padding: 8px 14px;
  cursor: pointer;
  background: white;
  transition: 0.2s;
}

.primary { background: #ff9f43; color: white; border: none; }

.active {
  background: #ff9f43 !important;
  color: white !important;
  border: none;
}

.actions {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
}

#copyBtn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

#copyBtn.copied {
  background: #34c759 !important;
  border-color: #34c759 !important;
  color: white !important;
}
</style>
</head>

<body>
<div class="container">

<h1>РИБА 🐟</h1>
<div class="subtitle">AI генератор резюме</div>

<div class="card">
  <div class="counter" id="counterInput">0 символів</div>
  <textarea id="input" placeholder="Встав текст..."></textarea>
  <div class="actions">
  <div style="display:flex; gap:8px;">
    <button onclick="clearInput()">Очистити</button>
    <button onclick="clearTrash()">🗑 Сміття</button>
  </div>
</div>
</div>

<div class="card">
  <div class="row modes">
    <button onclick="setMode('telegram')" id="telegram">Telegram</button>
    <button onclick="setMode('neutral')" id="neutral">Нейтрально</button>
    <button onclick="setMode('journal')" id="journal">Журналіст</button>
  </div>

  <div class="row sizes" style="margin-top:10px">
    <button onclick="setSize('short')" id="short">Стисло</button>
    <button onclick="setSize('medium')" id="medium">Середнє</button>
    <button onclick="setSize('long')" id="long">Детально</button>
  </div>
</div>

<div class="card">
  <div class="row">
    <button class="primary" onclick="send()">ЗРОБИТИ РИБУ</button>
  </div>
</div>

<div class="card">
  <div class="counter" id="counterOutput">0 символів</div>
  <textarea id="output" placeholder="Тут буде результат..."></textarea>

  <div class="actions">
    <div style="display:flex; gap:8px;">
      <button onclick="clearOutput()">Очистити</button>
      <button id="retryBtn" onclick="retry()" disabled>🔄 Ще раз</button>
    </div>

    <button id="copyBtn" onclick="copyOutput()">
      <span class="icon">📋</span>
      <span class="text">Скопіювати</span>
    </button>
  </div>
</div>

</div>

<script>
let mode = "neutral";
let size = "medium";
let lastText = null;
let lastMode = null;
let lastSize = null;

const input = document.getElementById("input");
const output = document.getElementById("output");
const counterInput = document.getElementById("counterInput");
const counterOutput = document.getElementById("counterOutput");

function autoResizeOutput() {
  output.style.height = "auto";
  output.style.height = output.scrollHeight + "px";
}

function updateInputCounter() {
  counterInput.innerText = input.value.length + " символів";
}

function updateOutputCounter() {
  counterOutput.innerText = output.value.length + " символів";
}

input.addEventListener("input", updateInputCounter);

output.addEventListener("input", () => {
  updateOutputCounter();
  autoResizeOutput();
});

function setMode(m) {
  mode = m;
  document.querySelectorAll(".modes button").forEach(b => b.classList.remove("active"));
  document.getElementById(m).classList.add("active");
}

function setSize(s) {
  size = s;
  document.querySelectorAll(".sizes button").forEach(b => b.classList.remove("active"));
  document.getElementById(s).classList.add("active");
}

async function send(isRetry = false) {
  if (!input.value.trim()) {
    output.value = "⚠️ Встав текст";
    updateOutputCounter();
    return;
  }

  if (!isRetry) {
    lastText = input.value;
    lastMode = mode;
    lastSize = size;
  }

  output.value = "⏳ Генеруємо...";
  updateOutputCounter();
  autoResizeOutput();

  try {
    const res = await fetch("/api/test", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text: isRetry ? lastText : input.value,
        mode: isRetry ? lastMode : mode,
        size: isRetry ? lastSize : size
      })
    });

    const data = await res.json();

    output.value = data.result || "";
    updateOutputCounter();
    autoResizeOutput();

    document.getElementById("retryBtn").disabled = false;

  } catch {
    output.value = "❌ Помилка";
    updateOutputCounter();
  }
}

function retry() {
  if (lastText) send(true);
}

function clearInput() {
  input.value = "";
  updateInputCounter();
}

function clearTrash() {
  input.value = "";
  let text = input.value;

  // 🔥 прибираємо блоки з "Підтримати" і "Приєднатися"
  text = text.replace(/🚀Підтримати[\s\S]*?(?=\n\n|$)/g, "");
  text = text.replace(/🚀Приєднатися[\s\S]*?(?=\n\n|$)/g, "");

  // 🔥 прибираємо залишки URL
  text = text.replace(/\(https?:\/\/[^\s]+\)/g, "");

  // очистити вставлений текст
  localStorage.removeItem("ryba_text");
  // 🔥 прибираємо зайві емодзі (як у тебе в бекенді)
  text = text.replace(/[\u{1F300}-\u{1F9FF}]/gu, "");
  text = text.replace(/[\u{2600}-\u{27BF}]/gu, "");

  // очистити URL (якщо передавали через ?text=)
  window.history.replaceState({}, document.title, window.location.pathname);
  // 🔥 нормалізуємо відступи
  text = text.replace(/\n{3,}/g, "\n\n").trim();

  input.value = text;
  updateInputCounter();
}

function clearOutput() {
  output.value = "";
  updateOutputCounter();
  autoResizeOutput();
}

function copyOutput() {
  if (!output.value) return;

  const btn = document.getElementById("copyBtn");

  try {
    navigator.clipboard.writeText(output.value);
  } catch {
    output.select();
    document.execCommand("copy");
  }

  btn.classList.add("copied");
  btn.querySelector(".text").textContent = "Скопійовано";
  btn.querySelector(".icon").textContent = "✔";

  setTimeout(() => {
    btn.classList.remove("copied");
    btn.querySelector(".text").textContent = "Скопіювати";
    btn.querySelector(".icon").textContent = "📋";
  }, 2000);
}

function cleanIncomingText(text) {
  return text
    // Назви джерел
    .replace(/^.*ITC\.ua.*$/gim, '')
    .replace(/^.*ITC\.UA.*$/gim, '')
    .replace(/^.*MC Today.*$/gim, '')
    .replace(/^.*mezha\.media.*$/gim, '')
    .replace(/^.*ain\.ua.*$/gim, '')
    .replace(/^.*dev\.ua.*$/gim, '')
    // Автор і дата
    .replace(/^від .*$/gm, '')
    .replace(/^от .*$/gm, '')
    .replace(/^Текст:.*$/gm, '')
    .replace(/^Фото:.*$/gm, '')
    .replace(/^Теги:.*$/gm, '')
    .replace(/^\d{1,2}:\d{2}.*$/gm, '')
    .replace(/^\d{1,2} [а-яА-Я]+ \d{4}.*$/gm, '')
    // Ім'я автора з посадою
    .replace(/^[А-ЯІЇЄ][а-яіїє]+ [А-ЯІЇЄ][а-яіїє]+\s+.{20,}$/gm, '')
    .replace(/^[А-ЯІЇЄ][а-яіїє]+ [А-ЯІЇЄ][а-яіїє]+\s*$/gm, '')
    // Системні повідомлення
    .replace(/You are overusing.*?listen/gs, '')
    .replace(/Understood/g, '')
    .replace(/Создать правило/g, '')
    .replace(/Читати у Telegram/g, '')
    // Футер і службові рядки
    .replace(/Читайте також[\s\S]*$/g, '')
    .replace(/The post .* first appeared on .*\./g, '')
    .replace(/Джерело:.*$/gm, '')
    .replace(/Источник:.*$/gm, '')
    .replace(/Знайшли помилку.*$/gm, '')
    .replace(/виділіть її та натисніть.*$/gm, '')
    .replace(/^Реклама.*$/gm, '')
    .replace(/^Поділитися.*$/gm, '')
    .replace(/Реклама:/g, '')
    // Останній рядок якщо це анонс іншої статті
    .replace(/\n[^\n]{40,}[^.!?»]\s*$/g, '')
    // Теги в кінці
    .replace(/^([А-ЯІЇЄа-яіїєA-Za-z]+ ?){1,3}$/gm, (match) => {
      return match.trim().length < 40 ? '' : match;
    })
    // Числа-лічильники
    .replace(/^\s*\d+\s*$/gm, '')
    // Зайві порожні рядки
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

// Отримуємо текст від Inoreader через URL параметр
(function() {
  const params = new URLSearchParams(window.location.search);
  const incoming = params.get('text');
  if (incoming) {
    input.value = cleanIncomingText(incoming);
    updateInputCounter();
    window.history.replaceState({}, '', '/');
  }
})();

setMode("neutral");
setSize("medium");
updateInputCounter();
updateOutputCounter();
autoResizeOutput();
</script>

</body>
</html>
