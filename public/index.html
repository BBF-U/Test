<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>РИБА 🐟</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: #f7f8fc;
  color: #222;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 12px;
}

h1 {
  text-align: center;
  font-size: 28px;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 20px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}

textarea {
  width: 100%;
  min-height: 120px;
  border-radius: 10px;
  border: 1px solid #ddd;
  padding: 12px;
  resize: none;
  font-size: 15px;
  line-height: 1.5;
}

#input {
  height: 140px;
  max-height: 140px;
  overflow-y: auto;
}

#output {
  overflow: hidden;
}

.counter {
  font-size: 12px;
  text-align: right;
  margin-bottom: 6px;
  color: #888;
}

.row {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

button {
  border-radius: 10px;
  border: 1px solid #ddd;
  padding: 8px 14px;
  cursor: pointer;
  background: white;
  transition: 0.2s;
  font-size: 14px;
}

button:hover {
  opacity: 0.9;
}

.primary {
  background: #ff9f43;
  color: white;
  border: none;
}

.chatgpt {
  background: #10a37f;
  color: white;
  border: none;
}

.active {
  background: #ff9f43 !important;
  color: white !important;
  border: none;
}

.actions {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
}

#copyBtn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

#copyBtn.copied {
  background: #34c759 !important;
  border-color: #34c759 !important;
  color: white !important;
}
</style>
</head>

<body>

<div class="container">

<h1>РИБА 🐟</h1>
<div class="subtitle">AI генератор резюме</div>

<!-- INPUT -->
<div class="card">

  <div class="counter" id="counterInput">0 символів</div>

  <textarea id="input" placeholder="Встав текст..."></textarea>

  <div class="actions">

    <div style="display:flex; gap:8px;">
      <button onclick="clearInput()">Очистити</button>
      <button onclick="clearTrash()">🗑 Сміття</button>
    </div>

    <button class="chatgpt" onclick="openChatGPT()">
      💬 ChatGPT
    </button>

  </div>

</div>

<!-- MODES -->
<div class="card">

  <div class="row modes">
    <button onclick="setMode('telegram')" id="telegram">Telegram</button>
    <button onclick="setMode('neutral')" id="neutral">Нейтрально</button>
    <button onclick="setMode('journal')" id="journal">Журналіст</button>
  </div>

  <div class="row sizes" style="margin-top:10px">
    <button onclick="setSize('short')" id="short">Стисло</button>
    <button onclick="setSize('medium')" id="medium">Середнє</button>
    <button onclick="setSize('long')" id="long">Детально</button>
  </div>

</div>

<!-- ACTION -->
<div class="card">

  <div class="row">
    <button class="primary" onclick="send()">
      ЗРОБИТИ РИБУ
    </button>
  </div>

</div>

<!-- OUTPUT -->
<div class="card">

  <div class="counter" id="counterOutput">0 символів</div>

  <textarea id="output" placeholder="Тут буде результат..."></textarea>

  <div class="actions">

    <div style="display:flex; gap:8px;">
      <button onclick="clearOutput()">Очистити</button>

      <button id="retryBtn" onclick="retry()" disabled>
        🔄 Ще раз
      </button>
    </div>

    <button id="copyBtn" onclick="copyOutput()">
      <span class="icon">📋</span>
      <span class="text">Скопіювати</span>
    </button>

  </div>

</div>

</div>

<script>
let mode = "neutral";
let size = "medium";

let lastText = null;
let lastMode = null;
let lastSize = null;

const input = document.getElementById("input");
const output = document.getElementById("output");

const counterInput = document.getElementById("counterInput");
const counterOutput = document.getElementById("counterOutput");

/* ================================
   AUTO RESIZE OUTPUT
================================= */
function autoResizeOutput() {
  output.style.height = "auto";
  output.style.height = output.scrollHeight + "px";
}

/* ================================
   COUNTERS
================================= */
function updateInputCounter() {
  counterInput.innerText = input.value.length + " символів";
}

function updateOutputCounter() {
  counterOutput.innerText = output.value.length + " символів";
}

/* ================================
   EVENTS
================================= */
input.addEventListener("input", updateInputCounter);

output.addEventListener("input", () => {
  updateOutputCounter();
  autoResizeOutput();
});

/* ================================
   MODE / SIZE
================================= */
function setMode(m) {

  mode = m;

  document
    .querySelectorAll(".modes button")
    .forEach(btn => btn.classList.remove("active"));

  document.getElementById(m).classList.add("active");
}

function setSize(s) {

  size = s;

  document
    .querySelectorAll(".sizes button")
    .forEach(btn => btn.classList.remove("active"));

  document.getElementById(s).classList.add("active");
}

/* ================================
   SEND
================================= */
async function send(isRetry = false) {

  if (!input.value.trim()) {

    output.value = "⚠️ Встав текст";
    updateOutputCounter();

    return;
  }

  if (!isRetry) {
    lastText = input.value;
    lastMode = mode;
    lastSize = size;
  }

  output.value = "⏳ Генеруємо...";

  updateOutputCounter();
  autoResizeOutput();

  try {

    const res = await fetch("/api/test", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        text: isRetry ? lastText : input.value,
        mode: isRetry ? lastMode : mode,
        size: isRetry ? lastSize : size
      })
    });

    const data = await res.json();

    output.value = data.result || "";

    updateOutputCounter();
    autoResizeOutput();

    document.getElementById("retryBtn").disabled = false;

  } catch (err) {

    console.error(err);

    output.value = "❌ Помилка";

    updateOutputCounter();
  }
}

/* ================================
   RETRY
================================= */
function retry() {

  if (lastText) {
    send(true);
  }
}

/* ================================
   CLEAR INPUT
================================= */
function clearInput() {

  input.value = "";

  updateInputCounter();
}

/* ================================
   CLEAR OUTPUT
================================= */
function clearOutput() {

  output.value = "";

  updateOutputCounter();
  autoResizeOutput();
}

/* ================================
   CLEAN JUNK
================================= */
function clearTrash() {

  let text = input.value;

  text = text.replace(/🚀Підтримати[\s\S]*?(?=\n\n|$)/g, "");
  text = text.replace(/🚀Приєднатися[\s\S]*?(?=\n\n|$)/g, "");

  text = text.replace(/\(https?:\/\/[^\s]+\)/g, "");

  text = text.replace(/[\u{1F300}-\u{1F9FF}]/gu, "");
  text = text.replace(/[\u{2600}-\u{27BF}]/gu, "");

  text = text.replace(/\n{3,}/g, "\n\n").trim();

  input.value = text;

  updateInputCounter();
}

/* ================================
   COPY OUTPUT (Сучасний метод)
================================= */
async function copyOutput() {
    if (!output.value) return;

    const btn = document.getElementById("copyBtn");

    try {
        await navigator.clipboard.writeText(output.value);
        
        btn.classList.add("copied");
        btn.querySelector(".text").textContent = "Скопійовано";
        btn.querySelector(".icon").textContent = "✔";

        setTimeout(() => {
            btn.classList.remove("copied");
            btn.querySelector(".text").textContent = "Скопіювати";
            btn.querySelector(".icon").textContent = "📋";
        }, 2000);
    } catch (err) {
        console.error("Помилка копіювання:", err);
    }
}

/* ================================
   CHATGPT (Фікс вставки)
================================= */
async function openChatGPT() {
    const text = input.value.trim();
    if (!text) {
        alert("Немає тексту");
        return;
    }

    const prompt = `Поясни дуже стисло і проаналізуй цей текст:\n\n${text}`;
    const btn = document.querySelector(".chatgpt");

    try {
        // Копіюємо промпт у буфер обміну
        await navigator.clipboard.writeText(prompt);

        const oldText = btn.innerHTML;
        btn.innerHTML = "✔ Скопійовано";

        setTimeout(() => {
            btn.innerHTML = oldText;
        }, 2000);

        window.open("https://chatgpt.com", "_blank");
    } catch (err) {
        console.error(err);
        alert("Не вдалося скопіювати текст");
    }
}

/* ================================
   CLEAN INCOMING TEXT
================================= */
function cleanIncomingText(text) {

  return text

    .replace(/^.*ITC\.ua.*$/gim, "")
    .replace(/^.*MC Today.*$/gim, "")
    .replace(/^.*mezha\.media.*$/gim, "")
    .replace(/^.*ain\.ua.*$/gim, "")
    .replace(/^.*dev\.ua.*$/gim, "")

    .replace(/^від .*$/gm, "")
    .replace(/^от .*$/gm, "")
    .replace(/^Текст:.*$/gm, "")
    .replace(/^Фото:.*$/gm, "")
    .replace(/^Теги:.*$/gm, "")

    .replace(/^\d{1,2}:\d{2}.*$/gm, "")
    .replace(/^\d{1,2} [а-яА-Я]+ \d{4}.*$/gm, "")

    .replace(/Читати у Telegram/g, "")

    .replace(/^Реклама.*$/gm, "")
    .replace(/^Поділитися.*$/gm, "")

    .replace(/Джерело:.*$/gm, "")
    .replace(/Источник:.*$/gm, "")

    .replace(/\n{3,}/g, "\n\n")

    .trim();
}

/* ================================
   LOAD FROM URL
================================= */
(function () {

  const params = new URLSearchParams(window.location.search);

  const incoming = params.get("text");

  if (incoming) {

    input.value = cleanIncomingText(incoming);

    updateInputCounter();

    window.history.replaceState({}, "", "/");
  }

})();

/* ================================
   INIT
================================= */
setMode("neutral");
setSize("medium");

updateInputCounter();
updateOutputCounter();

autoResizeOutput();
</script>

</body>
</html>
